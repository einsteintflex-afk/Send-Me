services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: sendme, POSTGRES_PASSWORD: sendme, POSTGRES_DB: sendme}
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://sendme:sendme@db:5432/sendme
    depends_on: [db]
    ports: ["8000:8000"]
    volumes: [uploads:/app/uploads]
volumes: {pgdata: {}, uploads: {}}
